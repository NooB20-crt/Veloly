# Publishes the website (the `site/` folder) to GitHub Pages on every push to main that
# touches it. One-time setup: Settings → Pages → Source: “GitHub Actions”.
name: Publish the website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs
      - name: Build VitePress documentation
        run: npm run build
        working-directory: docs
      - name: Add documentation to the website
        run: |
          mkdir -p site/docs
          cp -R docs/.vitepress/dist/. site/docs/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
